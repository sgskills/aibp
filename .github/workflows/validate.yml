name: Validate and build AIBP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare isolated test output
        shell: powershell
        run: |
          $testScratch = Join-Path $env:GITHUB_WORKSPACE '.work/3.1.0/tmp'
          New-Item -ItemType Directory -Force -Path $testScratch | Out-Null
          "TEMP=$testScratch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testScratch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove validator catches invalid fixtures
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\validator\test_validate.ps1

      - name: Validate repository
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run optimizer unit and Golden regressions
        shell: powershell
        run: |
          python -B -m unittest discover -s .\skills\sg-skill-optimizer\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-skill-optimizer\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-skill-optimizer\scripts\health_check.py .\skills\sg-skill-optimizer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-skill-optimizer\scripts\audit_description.py .\skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Tmall report regressions
        shell: powershell
        run: |
          python -B -m unittest discover -s .\tests\sg-tmads-report -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-tmads-report\tests\run_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run sg-research contract and routing regressions
        shell: powershell
        run: |
          python -B -m unittest discover -s .\skills\sg-research\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-research\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run AIBP router and specialist regressions
        shell: powershell
        run: |
          python -B -m unittest discover -s .\tests\sg-aibp -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\skills\sg-blackcat\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-blackcat\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\skills\sg-review\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-review\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\skills\sg-shiwu\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-shiwu\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\skills\sg-title\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-title\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s .\skills\sg-toplist\tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .\skills\sg-toplist\scripts\run_eval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check update behavior and Skill entry contracts on Windows
        shell: powershell
        run: |
          python -B -m unittest discover -s .\tests\update-check -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build twice and verify reproducible packages
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\build\test_build.ps1

  update-check-unix:
    name: Update check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare isolated test output
        shell: bash
        run: |
          test_scratch="$GITHUB_WORKSPACE/.work/3.1.0/tmp"
          mkdir -p -- "$test_scratch"
          printf 'TMPDIR=%s\n' "$test_scratch" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check update behavior with native sh and curl
        shell: bash
        run: python -B -m unittest discover -s ./tests/update-check -p "test_update_check.py"
