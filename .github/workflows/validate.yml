name: Validate and build AIBP

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove validator catches invalid fixtures
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\validator\test_validate.ps1

      - name: Validate repository
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\validate.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run optimizer unit and Golden regressions
        shell: powershell
        run: |
          python -B -m unittest discover -s .\skills\sg-skill-optimizer\tests -p "test_*.py"
          python -B .\skills\sg-skill-optimizer\scripts\run_eval.py
          python -B .\skills\sg-skill-optimizer\scripts\health_check.py .\skills\sg-skill-optimizer
          python -B .\skills\sg-skill-optimizer\scripts\audit_description.py .\skills

      - name: Run Tmall report regressions
        shell: powershell
        run: python -B -m unittest discover -s .\tests\sg-tmads-report -p "test_*.py"

      - name: Build and inspect packages
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\build\test_build.ps1
