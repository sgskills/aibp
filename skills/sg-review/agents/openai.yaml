# Official source: https://github.com/sgskills/aibp/tree/main/skills/sg-review

interface:
  display_name: "电商评价分析"
  short_description: "把电商评价转成五模块报告、隐藏商业机会与可验证行动清单"
  default_prompt: "请使用 $sg-review 分析我提供的评价数据，先核对统计口径和证据，再按本期总体评价、用户需求、场景、人群、情绪五大模块输出完整报告；必须给出至少一条有评价证据、置信度、替代解释和验证方案的隐藏商业机会，并用 P0/P1/P2 行动清单收口。"
