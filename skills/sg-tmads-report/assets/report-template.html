<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>

    .hero{background:linear-gradient(118deg,var(--brand-deep),var(--brand) 58%,#3d68df);color:#fff}.hero-inner{max-width:1240px;margin:auto;padding:34px 28px 30px;display:flex;justify-content:space-between;gap:28px;align-items:flex-end}
    .brand-kicker{display:block;margin-bottom:7px;font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#dce7ff}.hero h1{margin:0 0 7px;font-size:36px;line-height:1.12;letter-spacing:-.025em}.hero .meta{max-width:900px;color:#e9efff}.hero-mark{min-width:180px;text-align:right;font-weight:750;color:#fff}.hero-mark small{display:block;margin-top:5px;font-weight:400;color:#dce7ff}

    main{max-width:1240px;margin:auto;padding:24px 28px 44px}.risk-strip{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;margin-bottom:18px;padding:14px 17px;border:1px solid #efc875;border-left:5px solid var(--amber);border-radius:14px;background:var(--amber-soft);box-shadow:0 7px 18px rgba(168,84,0,.05)}.risk-strip b{color:#713b00}.risk-strip span:last-child{font-size:12px;color:var(--amber);font-weight:800}
    .panel,.section-shell{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:22px;margin:18px 0}.section-shell{padding:20px 22px;margin-top:18px}.panel.emphasis{border-left:5px solid var(--brand);background:linear-gradient(135deg,#fff,var(--brand-soft))}
    h1,h2,h3,p{overflow-wrap:anywhere}h2{margin:0 0 14px;font-size:21px;line-height:1.28;letter-spacing:-.01em}h3{margin:24px 0 10px;font-size:16px}.lead{max-width:920px;margin:-2px 0 16px;color:var(--ink-soft);font-size:15px}.eyebrow{display:block;margin-bottom:3px;color:var(--brand);font-size:10px;font-weight:850;letter-spacing:.15em;text-transform:uppercase}.muted,.meta{color:var(--muted)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.section-title{display:flex;align-items:center;gap:12px}.section-number{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--brand);color:#fff;font-weight:850;font-variant-numeric:tabular-nums}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr));gap:14px}.grid.compact{grid-template-columns:repeat(auto-fit,minmax(min(165px,100%),1fr))}.card{min-width:0;min-height:88px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow-wrap:anywhere}.card.secondary{background:#f8faff}.card b{display:block;margin-top:6px;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums}.good{color:var(--green)}.warn{color:var(--amber)}

    .priority-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.priority-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:#f9fbff}.priority-head{display:flex;justify-content:space-between;gap:12px}.priority-head h3{margin:0 0 2px;font-size:18px}.priority-head p{margin:0}.decision-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.decision-pair p{margin:0;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line)}.decision-pair span{display:block;color:var(--muted);font-size:11px}.decision-pair b{display:block;margin-top:3px}.metric-strip{padding:9px 11px;border-radius:9px;background:var(--brand-soft);color:var(--brand-deep);font-variant-numeric:tabular-nums}

    .closing{border-left:5px solid var(--brand)}
    .summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .badge.good{background:var(--green-soft);color:var(--green)}.badge.bad{background:var(--red-soft);color:var(--red)}
    .three-min{border-left:5px solid var(--brand)}.anchor-bar{margin:0 0 14px;padding:12px 16px;border-radius:10px;background:var(--brand-soft);color:var(--brand-deep);font-weight:750;line-height:1.7}.one-thing{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--red);background:#fff;border-radius:0 8px 8px 0}.one-thing:last-of-type{border-left-color:var(--amber)}
    .tier-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.tier-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:120px;padding:13px;border:1px solid var(--line);border-top:4px solid var(--muted);border-radius:12px;background:#fff;text-align:left;cursor:pointer;color:var(--ink)}.tier-card:hover,.tier-card[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}.tier-card span{font-weight:800;font-size:12.5px}.tier-card strong{font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}.tier-card small{color:var(--muted)}.tier-card .tier-rule{font-size:11px;line-height:1.5}.tier-card.tier-p0,.tier-card.tier-p1{border-top-color:var(--red)}.tier-card.tier-p0 strong,.tier-card.tier-p1 strong{color:var(--red)}.tier-card.tier-p2{border-top-color:var(--amber)}.tier-card.tier-p2 strong{color:var(--amber)}.tier-card.tier-p3{border-top-color:var(--brand)}.tier-card.tier-p3 strong{color:var(--brand)}.tier-card.tier-healthy{border-top-color:var(--green)}.tier-card.tier-healthy strong{color:var(--green)}.tier-card.tier-watch{border-top-color:#94a3b8}.tier-card.tier-watch strong{color:#64748b}
    .tier-chip{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.tier-chip.tier-p0,.tier-chip.tier-p1{background:var(--red-soft);color:var(--red)}.tier-chip.tier-p2{background:var(--amber-soft);color:var(--amber)}.tier-chip.tier-p3{background:var(--brand-soft);color:var(--brand-deep)}.tier-chip.tier-healthy{background:var(--green-soft);color:var(--green)}.tier-chip.tier-watch{background:#eef2f7;color:#47556f}
    .release-line{margin:12px 0 0;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:10px;background:#fbfdff;color:var(--ink-soft)}
    .preop-check{margin:0 0 14px;padding:10px 14px;border-left:4px solid var(--teal);background:var(--teal-soft);border-radius:0 8px 8px 0;color:#0a524d}
    .island-decision{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 10px}.idec{min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fff;overflow-wrap:anywhere}.idec span{display:block;color:var(--muted);font-size:12px;font-weight:750}.idec b{display:block;margin-top:5px;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.idec .badge{margin-top:6px}.idec .lamp{margin-top:6px;margin-left:0}
    .island-lead{margin:12px 0 0;font-size:15px;line-height:1.75;color:var(--ink);font-weight:650}
    .slim-strip{margin:8px 0 0;padding:10px 14px;border-radius:10px;background:#f8faff;color:var(--ink-soft);font-size:12.5px;line-height:1.8}
    tbody tr.row-loss{background:#fff5f4}tbody tr.row-loss:nth-child(even){background:#ffedeb}tbody tr.row-loss:hover{background:#ffe4e1}
    .lessons-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lessons-col{padding:17px 19px;border-radius:13px;border:1px solid var(--line)}.lessons-col h3{margin:0 0 8px;font-size:15px}.lessons-good{background:var(--green-soft);border-color:#cdeeda}.lessons-bad{background:var(--red-soft);border-color:#f3d2cd}.lessons-col li{margin:6px 0;line-height:1.7}
    .rules-list li{margin:8px 0;line-height:1.7}
    @media(max-width:1080px){.tier-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.island-decision{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:980px){.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:680px){.summary-grid{grid-template-columns:1fr}.tier-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lessons-grid{grid-template-columns:1fr}.island-decision{grid-template-columns:1fr}}
    .audit-zone{margin-top:22px;padding-top:3px}.empty{color:var(--muted);font-style:italic}code{background:#edf2fa;border-radius:5px;padding:2px 5px}footer{padding:18px 4px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:980px){.decision-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.priority-grid{grid-template-columns:1fr}.hero-inner{align-items:flex-start}.hero-mark{text-align:left}.hero-inner{flex-direction:column}}
    @media(max-width:680px){.hero-inner{padding:26px 13px 24px}.hero h1{font-size:29px}.nav-inner{padding:8px 8px}main{padding:14px 12px 34px}.panel,.section-shell{border-radius:14px;padding:16px}.risk-strip{grid-template-columns:1fr}.decision-grid{grid-template-columns:1fr}.decision-card{min-height:96px}.decision-pair{grid-template-columns:1fr}.section-head{display:block}.badge.neutral{margin-top:8px}.action-filters label,.filter-search{flex:1 1 100%}.action-filters select,.action-filters input{width:100%}.pagination{justify-content:space-between;flex-wrap:wrap}.priority-head{display:block}.priority-head .status{margin-top:8px}}
    @media print{body{background:#fff}.hero{background:#fff;color:#000;border-bottom:2px solid #000}.hero .meta,.brand-kicker,.hero-mark{color:#333}.report-nav,.action-filters,.pagination,.decision-card{display:none!important}main{max-width:none;padding:0}.panel,.section-shell{box-shadow:none;break-inside:avoid}.table-wrap{max-height:none;overflow:visible}.island-panel[hidden]{display:block}.action-table tr[hidden]{display:table-row}details>*{display:block!important}details summary{list-style:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.decision-card{transition:none!important}}

<body>
  <header class="hero">
    <div class="hero-inner">
      <div><span class="brand-kicker">SGSKILLS · TMALL ADS AUDIT</span><h1>{{TITLE}}</h1><div class="meta">{{SUBTITLE}}</div></div>
      <div class="hero-mark">决策证据报告<small>审表 → 追问 → 计算 → 动作门禁</small></div>
    </div>
  </header>
  <nav class="report-nav" aria-label="报告章节"><div class="nav-inner">
    <a href="#decision-summary">决策摘要</a><a href="#action-cockpit">行动驾驶舱</a><a href="#island-analysis">分岛分析</a><a href="#audit-ledger">审表台账</a><a href="#full-appendix">完整附录</a><button type="button" id="print-report">打印/另存PDF</button>
  </div></nav>
  <main>
    <aside class="risk-strip"><b>最大风险门禁</b><span>不同推广类型、归因窗口或成交互斥性未确认时，禁止跨岛相加；目标动作不等于当前允许动作。</span><span>需人工确认执行</span></aside>
    <div id="decision-summary">{{SUMMARY}}</div>
    {{ACTIONS}}
    {{DIAGNOSIS}}
    {{ISLANDS}}
    <div class="audit-zone" id="audit-ledger">{{AUDIT}}</div>
    {{QUESTIONS}}
    <div id="full-appendix">{{FORMULAS}}</div>
    {{CLOSING}}
    <footer>{{FOOTER}}</footer>
  </main>
  <script>
  (() => {
    "use strict";
    const qs = (selector, root = document) => root.querySelector(selector);
    const qsa = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const sortableValue = (cell) => {
      const raw = cell.dataset.sort ?? cell.textContent.trim();
      const normalized = raw.replaceAll(",", "").replace(/^¥/, "");
      const number = Number(normalized);
      return raw !== "" && Number.isFinite(number) ? number : raw.toLocaleLowerCase("zh-CN");
    };

    qsa("[data-filter-target]").forEach((input) => {
      const table = document.getElementById(input.dataset.filterTarget);
      if (!table) return;
      input.addEventListener("input", () => {
        const needle = input.value.trim().toLocaleLowerCase("zh-CN");
        qsa("tbody tr", table).forEach((row) => {
          row.hidden = needle !== "" && !row.textContent.toLocaleLowerCase("zh-CN").includes(needle);
        });
      });
    });

    const actionTable = qs("#actions");
    const actionControls = {
      level: qs("#action-level-filter"), target: qs("#action-target-filter"),
      island: qs("#action-island-filter"), item: qs("#action-item-filter"),
      protected: qs("#action-protected-filter"), attribution: qs("#action-attribution-filter"),
      anomaly: qs("#action-anomaly-filter"), search: qs("#action-search"),
      tier: qs("#action-tier-filter"),
      pageSize: qs("#action-page-size")
    };
    let actionPage = 1;
    const renderActions = () => {
      if (!actionTable) return;
      const rows = qsa("tbody tr", actionTable);
      const search = (actionControls.search?.value || "").trim().toLocaleLowerCase("zh-CN");
      const matches = rows.filter((row) => {
        const level = actionControls.level?.value || "all";
        return (level === "all" || (level === "protected" ? row.dataset.protected === "yes" : row.dataset.level === level))
          && ((actionControls.target?.value || "all") === "all" || row.dataset.target === actionControls.target.value)
          && ((actionControls.island?.value || "all") === "all" || row.dataset.island === actionControls.island.value)
          && ((actionControls.item?.value || "all") === "all" || row.dataset.item === actionControls.item.value)
          && ((actionControls.protected?.value || "all") === "all" || row.dataset.protected === actionControls.protected.value)
          && ((actionControls.attribution?.value || "all") === "all" || row.dataset.attribution === actionControls.attribution.value)
          && ((actionControls.anomaly?.value || "all") === "all" || row.dataset.anomaly === actionControls.anomaly.value)
          && ((actionControls.tier?.value || "all") === "all" || row.dataset.tier === actionControls.tier.value)
          && (search === "" || (row.dataset.search || "").includes(search));
      });
      const size = Number(actionControls.pageSize?.value || 20);
      const pages = Math.max(1, Math.ceil(matches.length / size));
      actionPage = Math.min(actionPage, pages);
      const start = (actionPage - 1) * size;
      const visible = new Set(matches.slice(start, start + size));
      rows.forEach((row) => { row.hidden = !visible.has(row); });
      const result = qs("#action-result");
      if (result) result.textContent = matches.length ? `当前显示 ${start + 1}–${Math.min(start + size, matches.length)}，共 ${matches.length} 个计划动作` : "当前筛选没有匹配动作";
      const pageStatus = qs("#action-page-status");
      if (pageStatus) pageStatus.textContent = `第 ${actionPage}/${pages} 页`;
      const prev = qs("#action-prev"), next = qs("#action-next");
      if (prev) prev.disabled = actionPage <= 1;
      if (next) next.disabled = actionPage >= pages;
    };
    if (actionTable) {
      Object.values(actionControls).filter(Boolean).forEach((control) => control.addEventListener("input", () => { actionPage = 1; renderActions(); }));
      qs("#action-reset")?.addEventListener("click", () => {
        Object.entries(actionControls).forEach(([key, control]) => { if (control && key !== "pageSize") control.value = key === "search" ? "" : "all"; });
        qsa("[data-action-level-card]").forEach((card) => card.setAttribute("aria-pressed", "false"));
        qsa("[data-tier-card]").forEach((card) => card.setAttribute("aria-pressed", "false"));
        actionPage = 1; renderActions();
      });
      qs("#action-prev")?.addEventListener("click", () => { actionPage -= 1; renderActions(); });
      qs("#action-next")?.addEventListener("click", () => { actionPage += 1; renderActions(); });
      qsa("[data-action-level-card]").forEach((card) => card.addEventListener("click", () => {
        const selected = card.getAttribute("aria-pressed") === "true";
        qsa("[data-action-level-card]").forEach((item) => item.setAttribute("aria-pressed", "false"));
        card.setAttribute("aria-pressed", String(!selected));
        if (actionControls.level) actionControls.level.value = selected ? "all" : card.dataset.actionLevelCard;
        actionPage = 1; renderActions();
      }));
      qsa("[data-tier-card]").forEach((card) => card.addEventListener("click", () => {
        const selected = card.getAttribute("aria-pressed") === "true";
        qsa("[data-tier-card]").forEach((item) => item.setAttribute("aria-pressed", "false"));
        card.setAttribute("aria-pressed", String(!selected));
        if (actionControls.tier) actionControls.tier.value = selected ? "all" : card.dataset.tierCard;
        actionPage = 1; renderActions();
      }));
      renderActions();
    }

    qsa("table.sortable .sort-button").forEach((button) => {
      button.addEventListener("click", () => {
        const header = button.closest("th"), table = button.closest("table"), body = qs("tbody", table);
        if (!header || !table || !body) return;
        const index = Array.from(header.parentElement.children).indexOf(header);
        const direction = header.getAttribute("aria-sort") === "ascending" ? "descending" : "ascending";
        qsa("th", table).forEach((item) => item.setAttribute("aria-sort", "none"));
        header.setAttribute("aria-sort", direction);
        const rows = qsa("tr", body).sort((left, right) => {
          const a = sortableValue(left.children[index]), b = sortableValue(right.children[index]);
          const compared = typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b), "zh-CN");
          return direction === "ascending" ? compared : -compared;
        });
        rows.forEach((row) => body.appendChild(row));
        if (table.id === "actions") renderActions();
      });
    });

    const islandTabs = qsa("[data-island-tab]");
    const activateIsland = (tab) => {
      islandTabs.forEach((item) => {
        const active = item === tab;
        item.setAttribute("aria-selected", String(active));
        item.tabIndex = active ? 0 : -1;
        const panel = document.getElementById(item.getAttribute("aria-controls"));
        if (panel) panel.hidden = !active;
      });
    };
    islandTabs.forEach((tab, index) => {
      tab.addEventListener("click", () => activateIsland(tab));
      tab.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        const targetIndex = event.key === "Home" ? 0 : event.key === "End" ? islandTabs.length - 1 : (index + (event.key === "ArrowRight" ? 1 : -1) + islandTabs.length) % islandTabs.length;
        islandTabs[targetIndex].focus(); activateIsland(islandTabs[targetIndex]);
      });
    });
    if (islandTabs.length) activateIsland(islandTabs[0]);
    qs("#print-report")?.addEventListener("click", () => window.print());
  })();
  </script>
</body>
</html>
